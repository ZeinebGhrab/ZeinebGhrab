<text x="22" y="76" font-size="12.5" fill="#5B5670">Analyse statistique de données cliniques d'AVC pour</text><text x="22" y="94" font-size="12.5" fill="#5B5670">étudier les associations entre les scores NIHSS, l'âge, le</text><text x="22" y="112" font-size="12.5" fill="#5B5670">mode de vie et la présence d'un AVC, avec visualisations</text><text x="22" y="130" font-size="12.5" fill="#5B5670">et tests d'hypothèses pour en tirer des enseignements</text><text x="22" y="148" font-size="12.5" fill="#5B5670">médicaux.</text><rect x="22" y="176" width="67" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="187" r="4" fill="#3776AB"/><text x="42" y="191" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Python</text><rect x="95" y="176" width="67" height="22" rx="11" fill="#F0EDFB"/><circle cx="106" cy="187" r="4" fill="#150458"/><text x="115" y="191" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Pandas</text><rect x="169" y="176" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="180" cy="187" r="4" fill="#8CAAE6"/><text x="189" y="191" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">SciPy</text><rect x="235" y="176" width="74" height="22" rx="11" fill="#F0EDFB"/><circle cx="246" cy="187" r="4" fill="#A855F7"/><text x="255" y="191" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Seaborn</text><rect x="316" y="176" width="95" height="22" rx="11" fill="#F0EDFB"/><circle cx="327" cy="187" r="4" fill="#EC4899"/><text x="336" y="191" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Matplotlib</text><rect x="22" y="314" width="124" height="26" rx="13" fill="#3B82F6"/><text x="84" y="331.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">Voir le projet  &#8594;</text></svg>