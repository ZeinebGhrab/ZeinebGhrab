<text x="22" y="46" font-size="18" font-weight="800" fill="#1F1B2E">EduPlanner</text>
<text x="22" y="66" font-size="12.5" font-weight="700" fill="#6C63FF">Plateforme intelligente de planification et d'aide à la décision</text><text x="22" y="92" font-size="12.5" fill="#5B5670">Conception et implémentation d'un système d'aide à la</text><text x="22" y="110" font-size="12.5" fill="#5B5670">décision pour la planification d'un centre de formation,</text><text x="22" y="128" font-size="12.5" fill="#5B5670">combinant planification sous contraintes, heuristiques</text><text x="22" y="146" font-size="12.5" fill="#5B5670">d'optimisation et résolution de conflits en temps réel au</text><text x="22" y="164" font-size="12.5" fill="#5B5670">sein d'une application web full-stack sécurisée.</text><rect x="22" y="192" width="54" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="203" r="4" fill="#ED8B00"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle><text x="42" y="207" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Java</text><rect x="82" y="192" width="102" height="22" rx="11" fill="#F0EDFB"/><circle cx="93" cy="203" r="4" fill="#6DB33F"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle><text x="102" y="207" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Spring Boot</text><rect x="190" y="192" width="185" height="22" rx="11" fill="#F0EDFB"/><circle cx="200" cy="203" r="4" fill="#A855F7"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><text x="210" y="207" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Optimization Algorithms</text><rect x="22" y="220" width="136" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="231" r="4" fill="#8B5CF6"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle><text x="42" y="235" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Decision Systems</text><rect x="164" y="220" width="47" height="22" rx="11" fill="#F0EDFB"/><circle cx="175" cy="231" r="4" fill="#8B949E"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle><text x="184" y="235" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">JWT</text><rect x="217" y="220" width="136" height="22" rx="11" fill="#F0EDFB"/><circle cx="228" cy="231" r="4" fill="#F7DF1E"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle><text x="237" y="235" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">JavaScript (ES6)</text><rect x="359" y="220" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="370" cy="231" r="4" fill="#E34F26"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><text x="379" y="235" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">HTML5</text><rect x="22" y="248" width="54" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="259" r="4" fill="#1572B6"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle><text x="42" y="263" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">CSS3</text><rect x="22" y="314" width="124" height="26" rx="13" fill="#6C63FF"/><clipPath id="sh0"><rect x="22" y="314.0" width="124" height="26" rx="13"/></clipPath><g clip-path="url(#sh0)"><rect x="-48" y="314.0" width="60" height="26" fill="url(#shG)"><animate attributeName="x" values="-48;166;166" keyTimes="0;0.3;1" dur="5.5s" begin="1.0s" re