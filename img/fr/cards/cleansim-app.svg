<text x="22" y="66" font-size="12.5" font-weight="700" fill="#10B981">Plateforme de simulation de nettoyage pilotée par l'IA</text><text x="22" y="92" font-size="12.5" fill="#5B5670">Développement d'une simulation web mettant en scène un</text><text x="22" y="110" font-size="12.5" fill="#5B5670">agent IA autonome capable de naviguer et de nettoyer un</text><text x="22" y="128" font-size="12.5" fill="#5B5670">environnement généré dynamiquement.</text><rect x="22" y="156" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="167" r="4" fill="#6B7280"/><text x="42" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Flask</text><rect x="88" y="156" width="81" height="22" rx="11" fill="#F0EDFB"/><circle cx="100" cy="167" r="4" fill="#61DAFB"/><text x="108" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">React.js</text><rect x="176" y="156" width="95" height="22" rx="11" fill="#F0EDFB"/><circle cx="187" cy="167" r="4" fill="#3178C6"/><text x="196" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">TypeScript</text><rect x="277" y="156" width="88" height="22" rx="11" fill="#F0EDFB"/><circle cx="288" cy="167" r="4" fill="#7952B3"/><text x="297" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Bootstrap</text><rect x="371" y="156" width="67" height="22" rx="11" fill="#F0EDFB"/><circle cx="382" cy="167" r="4" fill="#3776AB"/><text x="391" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Python</text><rect x="22" y="196" width="124" height="26" rx="13" fill="#10B981"/><text x="84" y="213.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">Voir le projet  &#8594;</text></svg>