<text x="22" y="46" font-size="18" font-weight="800" fill="#1F1B2E">Aurora</text>
<text x="22" y="66" font-size="12.5" font-weight="700" fill="#EC4899">Plateforme éducative nouvelle génération</text><text x="22" y="92" font-size="12.5" fill="#5B5670">Développement d'une application web full-stack moderne</text><text x="22" y="110" font-size="12.5" fill="#5B5670">pour la gestion pédagogique, permettant aux</text><text x="22" y="128" font-size="12.5" fill="#5B5670">administrateurs, enseignants et étudiants de gérer les</text><text x="22" y="146" font-size="12.5" fill="#5B5670">cours, les séances et les présences. Inclut des mises à</text><text x="22" y="164" font-size="12.5" fill="#5B5670">jour en temps réel, des notifications par e-mail et la</text><text x="22" y="182" font-size="12.5" fill="#5B5670">reconnaissance faciale pour la vérification des présences.</text><text x="22" y="200" font-size="12.5" fill="#5B5670">Prend en charge la planification des cours, des séances et</text><text x="22" y="218" font-size="12.5" fill="#5B5670">des analyses détaillées sur les étudiants.</text><rect x="22" y="246" width="47" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="257" r="4" fill="#777BB4"/><text x="42" y="261" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">PHP</text><rect x="75" y="246" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="86" cy="257" r="4" fill="#4479A1"/><text x="95" y="261" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">MySQL</text><rect x="141" y="246" width="136" height="22" rx="11" fill="#F0EDFB"/><circle cx="152" cy="257" r="4" fill="#F7DF1E"/><text x="161" y="261" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">JavaScript (ES6)</text><rect x="284" y="246" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="295" cy="257" r="4" fill="#E34F26"/><text x="304" y="261" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">HTML5</text><rect x="350" y="246" width="54" height="22" rx="11" fill="#F0EDFB"/><circle cx="361" cy="257" r="4" fill="#1572B6"/><text x="370" y="261" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">CSS3</text><rect x="22" y="274" width="88" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="285" r="4" fill="#EC4899"/><text x="42" y="289" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">PHPMailer</text><rect x="116" y="274" width="81" height="22" rx="11" fill="#F0EDFB"/><circle cx="127" cy="285" r="4" fill="#885630"/><text x="136" y="289" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Composer</text><rect x="203" y="274" width="143" height="22" rx="11" fill="#F0EDFB"/><circle cx="214" cy="285" r="4" fill="#3776AB"/><text x="223" y="289" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Python (DeepFace)</text><rect x="22" y="314" width="124" height="26" rx="13" fill="#EC4899"/><text x="84" y="331.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">Voir le projet  &#8594;</text></svg>