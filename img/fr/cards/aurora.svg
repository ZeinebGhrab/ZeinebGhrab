<svg xmlns="http://www.w3.org/2000/svg" width="480" height="354" viewBox="0 0 480 354" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6C63FF"/><stop offset="35%" stop-color="#A855F7"/><stop offset="70%" stop-color="#EC4899"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient></defs>
