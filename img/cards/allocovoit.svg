<text x="22" y="46" font-size="18" font-weight="800" fill="#1F1B2E">AlloCovoit</text>
<text x="22" y="66" font-size="12.5" font-weight="700" fill="#F59E0B">Carpooling Web Platform</text><text x="22" y="92" font-size="12.5" fill="#5B5670">Developed a modern full-stack carpooling web application</text><text x="22" y="110" font-size="12.5" fill="#5B5670">allowing users to publish trips, manage reservations, and</text><text x="22" y="128" font-size="12.5" fill="#5B5670">connect securely with other travelers. The platform</text><text x="22" y="146" font-size="12.5" fill="#5B5670">includes user and admin dashboards, real-time updates via</text><text x="22" y="164" font-size="12.5" fill="#5B5670">AJAX, email notifications, and secure authentication with</text><text x="22" y="182" font-size="12.5" fill="#5B5670">role-based access control.</text><rect x="22" y="210" width="47" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="221" r="4" fill="#777BB4"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle><text x="42" y="225" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">PHP</text><rect x="75" y="210" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="86" cy="221" r="4" fill="#4479A1"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle><text x="95" y="225" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">MySQL</text><rect x="141" y="210" width="136" height="22" rx="11" fill="#F0EDFB"/><circle cx="152" cy="221" r="4" fill="#F7DF1E"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><text x="161" y="225" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">JavaScript (ES6)</text><rect x="284" y="210" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="295" cy="221" r="4" fill="#E34F26"><animate attributeName