<text x="22" y="46" font-size="18" font-weight="800" fill="#1F1B2E">MiniGit</text>
<text x="22" y="66" font-size="12.5" font-weight="700" fill="#22C55E">Git-inspired lightweight version control system for Linux</text><text x="22" y="92" font-size="12.5" fill="#5B5670">Built a minimalist VCS in C for Linux, featuring SHA-256</text><text x="22" y="110" font-size="12.5" fill="#5B5670">file hashing, blob creation, WorkTree management, and</text><text x="22" y="128" font-size="12.5" fill="#5B5670">filesystem snapshots.</text><rect x="22" y="156" width="33" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="167" r="4" fill="#00599C"/><text x="42" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">C</text><rect x="61" y="156" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="72" cy="167" r="4" fill="#FCC624"/><text x="81" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Linux</text><rect x="127" y="156" width="47" height="22" rx="11" fill="#F0EDFB"/><circle cx="138" cy="167" r="4" fill="#A855F7"/><text x="147" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">GCC</text><rect x="22" y="196" width="124" height="26" rx="13" fill="#22C55E"/><text x="84" y="213.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">View Project  &#8594;</text></svg>