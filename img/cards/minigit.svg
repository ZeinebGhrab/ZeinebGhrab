<text x="22" y="46" font-size="18" font-weight="800" fill="#1F1B2E">MiniGit</text>
<text x="22" y="66" font-size="12.5" font-weight="700" fill="#22C55E">Git-inspired lightweight version control system for Linux</text><text x="22" y="92" font-size="12.5" fill="#5B5670">Built a minimalist VCS in C for Linux, featuring SHA-256</text><text x="22" y="110" font-size="12.5" fill="#5B5670">file hashing, blob creation, WorkTree management, and</text><text x="22" y="128" font-size="12.5" fill="#5B5670">filesystem snapshots.</text><rect x="22" y="156" width="33" height="22" rx="11" fill="#F0EDFB"/><circle cx="33" cy="167" r="4" fill="#00599C"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle><text x="42" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">C</text><rect x="61" y="156" width="60" height="22" rx="11" fill="#F0EDFB"/><circle cx="72" cy="167" r="4" fill="#FCC624"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle><text x="81" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">Linux</text><rect x="127" y="156" width="47" height="22" rx="11" fill="#F0EDFB"/><circle cx="138" cy="167" r="4" fill="#A855F7"><animate attributeName="r" values="4.0;5.4;4.0" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle><text x="147" y="171" font-size="11.5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" fill="#3B3556">GCC</text><rect x="22" y="196" width="124" height="26" rx="13" fill="#22C55E"/><clipPath id="sh0"><rect x="22" y="196.0" width="124" height="26" rx="13"/></clipPath><g clip-path="url(#sh0)"><rect x="-48" y="196.0" width="60" height="26" fill="url(#shG)"><animate attributeName="x" values="-48;166;166" keyTimes="0;0.3;1" dur="5.5s" begin="1.0s" repeatCount="indefinite"/></rect></g><text x="84" y="213.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#FFFFFF">View Pro